<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OtelSaaS</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    body { font-family: -apple-system, sans-serif; background: #f5f7fa; color: #333; }
    .login-page { display:flex; align-items:center; justify-content:center; min-height:80vh; }
    .login-card { background:#fff; border-radius:12px; padding:40px; width:380px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
    .login-card h1 { font-size:24px; color:#1a5276; text-align:center; margin-bottom:4px; }
    .login-sub { font-size:13px; color:#888; text-align:center; margin-bottom:24px; }
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-size:13px; color:#555; margin-bottom:4px; }
    .form-group input { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:6px; font-size:14px; }
    .form-group input:focus { outline:none; border-color:#1a5276; }
    .btn { display:inline-flex; align-items:center; justify-content:center; padding:10px 24px; border-radius:6px; font-size:14px; font-weight:500; border:none; cursor:pointer; }
    .btn-primary { background:#1a5276; color:#fff; width:100%; }
    .btn-primary:hover { background:#154360; }
    .error { background:#fef2f2; color:#c62828; padding:10px 14px; border-radius:6px; margin-bottom:16px; font-size:13px; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>OtelSaaS</h1>
      <p class="login-sub">Otel Yonetim Sistemi</p>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <form method="POST" action="/auth/login">
        <div class="form-group">
          <label>E-posta</label>
          <input type="email" name="username" required autofocus>
        </div>
        <div class="form-group">
          <label>Sifre</label>
          <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Giris Yap</button>
      </form>
    </div>
  </div>
</body>
</html>
