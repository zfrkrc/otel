{% extends "dashboard.html" %}{% block content %}
<h2>Yeni Rezervasyon</h2>
<form method="POST" action="/reservations/new" style="background:#fff;padding:24px;border-radius:8px;max-width:500px">
  <div style="margin-bottom:12px"><label style="display:block;font-size:13px;color:#555;margin-bottom:4px">Musteri</label>
  <select name="guest_id" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px">
    {% for g in guests %}<option value="{{ g.id }}">{{ g.first_name }} {{ g.last_name }}</option>{% endfor %}</select></div>
  <div style="margin-bottom:12px"><label style="display:block;font-size:13px;color:#555;margin-bottom:4px">Oda</label>
  <select name="room_id" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px">
    {% for r in rooms %}<option value="{{ r.id }}">{{ r.room_number }}</option>{% endfor %}</select></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
    <div><label style="display:block;font-size:13px;color:#555;margin-bottom:4px">Giris Tarihi</label><input type="date" name="check_in" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px"></div>
    <div><label style="display:block;font-size:13px;color:#555;margin-bottom:4px">Cikis Tarihi</label><input type="date" name="check_out" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px"></div>
  </div>
  <div style="margin-bottom:12px"><label style="display:block;font-size:13px;color:#555;margin-bottom:4px">Kisi Sayisi</label><input type="number" name="adults" value="1" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px"></div>
  <div style="margin-bottom:20px"><label style="display:block;font-size:13px;color:#555;margin-bottom:4px">Not</label><textarea name="notes" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px" rows="2"></textarea></div>
  <button type="submit" class="btn btn-primary" style="width:auto">Olustur</button>
</form>
{% endblock %}
