services:
  otel:
    build: .
    container_name: otel
    ports:
      - "8200:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://otel:otel_pass@postgres:5432/otel
      - SECRET_KEY=${SECRET_KEY:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: otel-db
    environment:
      - POSTGRES_DB=otel
      - POSTGRES_USER=otel
      - POSTGRES_PASSWORD=otel_pass
    volumes:
      - otel_db_data:/var/lib/postgresql/data
    ports:
      - "5500:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otel"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  otel_db_data:
